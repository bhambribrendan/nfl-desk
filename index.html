<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NFL Desk">
<meta name="theme-color" content="#010102">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 180 180%27%3E%3Crect width=%27180%27 height=%27180%27 rx=%2740%27 fill=%27%23010102%27/%3E%3Crect x=%2750%27 y=%2750%27 width=%2780%27 height=%2780%27 rx=%2720%27 fill=%27%235e6ad2%27/%3E%3C/svg%3E">
<meta name="color-scheme" content="dark">
<title>NFL Sunday Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#010102; --card:#0f1011; --surf2:#141516; --surf3:#18191a; --ink:#f7f8f8; --ink2:#d0d6e0; --mute:#8a8f98; --mute2:#62666d; --line:#23252a; --line2:#1a1b1e; --line-strong:#34343a;
  --accent:#5e6ad2; --accent-h:#828fff; --live:#e5484d; --final:#8a8f98; --green:#27a644; --amber:#d9a441; --purple:#828fff; --ontint:#ffffff;
  --inv-bg:#010102; --inv-fg:#f7f8f8; --inv-mute:#8a8f98; --inv-mute2:#62666d; --inv-btn:#141516; --inv-btn2:#34343a; --inv-btn-h:#18191a; --inv-green:#7fe0a6;
  --btn:#5e6ad2; --btnfg:#ffffff; --chipbg:#141516; --chipfg:#d0d6e0; --chipbd:#34343a; --win:#121318; --hl1:#141516; --hl2:#191416; --focus:#141516;
  --tagdark:#f7f8f8; --tagdark-fg:#010102; --fg-soft:#3e3e44; --to-soft:#2b2f5a; --ok:#27a644; --warn:#d9a441; --err:#e5484d;
  --f-disp:"Inter",system-ui,-apple-system,sans-serif; --f-body:"Inter",system-ui,-apple-system,sans-serif; --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --track:-0.02em; --r:8px; --r-lg:12px; --shadow:none; --tt:none; --ls:0; --disp-w:600;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.35}
button{font:inherit;cursor:pointer}
.tbtn,.filt button,.lgtabs button,.uctl .grp button,.subt button{text-transform:var(--tt);letter-spacing:var(--ls)}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--inv-bg);color:var(--inv-fg);display:flex;align-items:center;gap:18px;padding:0 20px;min-height:56px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:var(--disp-w);letter-spacing:var(--track);font-size:26px;letter-spacing:.01em;line-height:1;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--inv-mute);letter-spacing:0}
.tabs{display:flex;gap:2px;height:100%}
.tabs button{background:none;border:0;color:var(--inv-mute);padding:0 14px;height:56px;font-family:var(--f-disp);font-size:19px;font-weight:600;text-transform:var(--tt);letter-spacing:var(--ls);border-bottom:3px solid transparent;position:relative}
.tabs button.on{color:var(--inv-fg);border-bottom-color:var(--live)}
.tabs button .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--live);color:var(--ontint);font-family:var(--f-body);font-size:11px;font-weight:700;line-height:18px;vertical-align:2px}
.tabs button .cnt:empty{display:none}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--inv-mute)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.status .dot.err{background:var(--err)}.status .dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.tbtn{background:var(--inv-btn);border:1px solid var(--inv-btn2);color:var(--inv-fg);border-radius:var(--r);padding:6px 12px;font-weight:600;font-size:13px}
.tbtn:hover{background:var(--inv-btn-h)}
.tbtn.ghost{background:transparent}
.tbtn.ghost.on{background:var(--inv-btn)}
label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}

/* ---------- layout ---------- */
.wrap{padding:18px 20px 60px;max-width:1600px;margin:0 auto}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.sect{margin:26px 0 10px;font-family:var(--f-disp);font-size:22px;font-weight:700;letter-spacing:var(--track);color:var(--ink);display:flex;align-items:center;gap:10px}
.sect span{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--mute)}
.empty{color:var(--mute);padding:30px 0;text-align:center}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:6px}
.ms{background:var(--inv-bg);color:var(--inv-fg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.ms .ln{font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--inv-mute);margin-bottom:6px}
.ms .row{display:grid;grid-template-columns:1fr 54px 54px;align-items:baseline;gap:6px;padding:2px 0}
.ms .row.me .tn{color:var(--inv-green)}
.ms .tn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms .sc{font-family:var(--f-disp);font-size:24px;font-weight:800;text-align:right;line-height:1}
.ms .pj{font-family:var(--f-disp);font-size:16px;font-weight:600;text-align:right;color:var(--inv-mute)}
.ms .pj.up{color:var(--inv-fg)}
.ms .lg{font-size:10.5px;color:var(--inv-mute2);text-align:right;margin-top:2px}
/* ---------- game card ---------- */
.g{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .12s}
.g:hover{box-shadow:var(--shadow)}
.g:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.g .hd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px;font-size:12.5px;color:var(--ink2)}
.g .hd b{font-family:var(--f-disp);font-size:17px;font-weight:700;color:var(--final)}
.g.live .hd b{color:var(--live)}
.g .hd .rz{background:var(--live);color:var(--ontint);font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;margin-left:8px;letter-spacing:.02em}
.g .hd .tv{color:var(--mute)}
.teams{padding:0 12px}
.trow{display:grid;grid-template-columns:28px 1fr repeat(var(--q,4),22px) 40px;align-items:center;gap:6px;height:36px;border-top:1px solid var(--line2)}
.trow:first-child{border-top:0}
.trow img{width:26px;height:26px;object-fit:contain}
.trow .nm{display:flex;align-items:baseline;gap:7px;min-width:0}
.trow .nm b{font-family:var(--f-disp);font-size:19px;font-weight:700;white-space:nowrap}
.trow .nm i{font-style:normal;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .nm .pos{width:0;height:0;border:5px solid transparent;border-left:8px solid var(--ink);margin-left:2px;align-self:center}
.trow .q{font-size:12.5px;color:var(--ink2);text-align:center}
.trow .q.cur{color:var(--ink);font-weight:600}
.trow .t{font-family:var(--f-disp);font-size:26px;font-weight:var(--disp-w);letter-spacing:var(--track);text-align:right;line-height:1}
.trow.lose .t,.trow.lose .nm b{color:var(--mute)}
.wp{height:4px;background:var(--surf2);display:flex;margin:6px 12px 0;border-radius:2px;overflow:hidden}
.wp i{height:100%;display:block}
.sit{padding:8px 12px 10px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line2);margin-top:8px}
.sit b{color:var(--ink)}
.sit .lp{display:block;margin-top:3px;color:var(--mute);line-height:1.3;max-height:2.6em;overflow:hidden}
.mine{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px}
.chip{background:var(--chipbg);color:var(--chipfg);border:1px solid var(--chipbd);border-radius:12px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.opp{background:var(--surf2);color:var(--ink2);border-color:var(--line)}
.chip .pt{font-weight:700;margin-left:3px}
.g .ldrs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px 10px;font-size:11.5px;color:var(--ink2)}
.g .ldrs div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.g .ldrs b{color:var(--ink);font-weight:600}
.g .ldrs small{color:var(--mute);display:block;font-size:10.5px}

/* ---------- drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:30;display:none}
.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--paper);z-index:31;transform:translateX(102%);transition:transform .2s ease-out;display:flex;flex-direction:column;box-shadow:-4px 0 30px rgba(0,0,0,.25)}
.dr.on{transform:none}
@media (prefers-reduced-motion:reduce){.dr{transition:none}}
.dr .dh{background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px}
.dr .dh .row{display:flex;align-items:center;gap:12px}
.dr .dh .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r);width:34px;height:34px;font-size:18px;line-height:1}
.dr .score{display:flex;align-items:center;gap:14px;margin-top:8px}
.dr .score .tm{display:flex;align-items:center;gap:8px;flex:1}
.dr .score .tm img{width:38px;height:38px}
.dr .score .tm b{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1}
.dr .score .tm small{display:block;color:var(--mute);font-size:12px;font-weight:500;font-family:var(--f-body)}
.dr .score .s{font-family:var(--f-disp);font-size:40px;font-weight:800;line-height:1}
.dr .score .mid{text-align:center;color:var(--ink2);font-size:12.5px;min-width:90px}
.dr .score .mid b{display:block;font-family:var(--f-disp);font-size:18px;color:var(--live)}
.dr .score .mid b.fin{color:var(--final)}
.dr .score .tm.away{flex-direction:row-reverse;text-align:right}
.dr .score .tm.away .s{order:-1}
.subt{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);padding:0 12px}
.subt button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.subt button.on{color:var(--ink);border-bottom-color:var(--ink)}
.dbody{overflow:auto;padding:16px 18px 40px;flex:1}
.recap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;line-height:1.5;margin-bottom:16px}
.h{font-family:var(--f-disp);font-size:18px;font-weight:700;margin:18px 0 8px}
.h:first-child{margin-top:0}
.sp{display:grid;grid-template-columns:34px 60px 1fr 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.sp img{width:26px;height:26px}
.sp .k{font-family:var(--f-disp);font-weight:700;font-size:15px}
.sp .k.td{color:var(--live)}
.sp .sc{font-family:var(--f-disp);font-weight:700;font-size:17px;text-align:right}
.sp small{color:var(--mute);display:block}
.dv{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.dv img{width:20px;height:20px}
.dv .res{margin-left:auto;font-weight:700;font-family:var(--f-disp);font-size:14px;padding:1px 7px;border-radius:3px;background:var(--surf2);white-space:nowrap}
.dv .res.TD{background:var(--live);color:var(--ontint)}.dv .res.FG{background:var(--fg-soft)}.dv .res.INT,.dv .res.FUMBLE,.dv .res.DOWNS,.dv .res.SF{background:var(--to-soft)}
.dv .res.cur{background:var(--green);color:var(--ontint)}
.dv small{color:var(--mute)}
table.bx{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px;background:var(--card);border:1px solid var(--line)}
.bx th{font-weight:600;color:var(--mute);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11.5px;white-space:nowrap}
.bx td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
.bx th:first-child,.bx td:first-child{text-align:left}
.bx td:first-child{font-weight:600}
.bx td.fp{font-family:var(--f-disp);font-size:15px;font-weight:700;color:var(--green)}
.bx tr.my td:first-child::before{content:"★ ";color:var(--green)}
.bx caption{text-align:left;font-family:var(--f-disp);font-size:17px;font-weight:700;padding:8px 8px 6px;caption-side:top}
.pl{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;display:grid;grid-template-columns:70px 1fr;gap:10px}
.pl .when{color:var(--mute);font-size:12px}
.pl.big{background:var(--ontint)8e6;margin:0 -8px;padding:7px 8px;border-radius:4px}
.pl.score{background:var(--hl2)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px;margin-right:6px;vertical-align:1px;color:var(--ontint);background:var(--ink2)}
.tag.TD{background:var(--live)}.tag.FG{background:var(--amber)}.tag.TO{background:var(--accent)}.tag.BIG{background:var(--purple)}.tag.INJ{background:var(--tagdark);color:var(--tagdark-fg)}.tag.RZ{background:var(--green)}.tag.SAFETY{background:var(--live)}

/* ---------- big plays feed ---------- */
.filt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.filt button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:600;font-size:12.5px;color:var(--ink2)}
.filt button.on{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.feed{max-width:900px}
.bp{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:var(--r);padding:10px 14px;margin-bottom:8px;display:grid;grid-template-columns:92px 1fr;gap:12px;cursor:pointer}
.bp:hover{box-shadow:var(--shadow)}
.bp.TD,.bp.SAFETY{border-left-color:var(--live)}.bp.FG{border-left-color:var(--amber)}.bp.TO{border-left-color:var(--accent)}.bp.BIG{border-left-color:var(--purple)}.bp.INJ{border-left-color:var(--tagdark)}.bp.RZ{border-left-color:var(--green)}
.bp .gm{font-family:var(--f-disp);font-weight:700;font-size:16px;line-height:1.1}
.bp .gm small{display:block;font-family:var(--f-body);color:var(--mute);font-size:11.5px;font-weight:500;margin-top:3px}
.bp .tx{line-height:1.4}
.bp .tx .who{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.bp .yd{font-family:var(--f-disp);font-weight:800;font-size:18px;color:var(--purple);margin-right:6px}
.rzlive{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:18px}
.rzc{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:var(--r);padding:10px 12px;cursor:pointer;font-size:13px}
.rzc b{font-family:var(--f-disp);font-size:17px}
.rzc small{color:var(--mute);display:block}

.rc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:960px){.rc{grid-template-columns:1fr}}
.rc .col{min-width:0}
.story{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:var(--r);padding:10px 14px;margin-bottom:8px}
.story.upset{border-left-color:var(--live)}.story.blowout{border-left-color:var(--purple)}.story.close{border-left-color:var(--amber)}.story.comeback{border-left-color:var(--green)}.story.star{border-left-color:var(--accent)}.story.bust{border-left-color:var(--tagdark)}
.story b.t{font-family:var(--f-disp);font-size:17px;font-weight:700;display:block;margin-bottom:2px}
.story small{color:var(--mute);display:block;margin-top:3px}
.story .jk{margin-top:6px;font-style:italic;color:var(--ink2)}
.draft{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:sticky;top:70px}
.draft .dhd{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.draft .dhd b{font-family:var(--f-disp);font-size:18px;font-weight:700;margin-right:auto}
.draft textarea{width:100%;min-height:560px;border:0;padding:14px;font:13.5px/1.5 var(--f-body);resize:vertical;outline:none;color:var(--ink);background:var(--card)}
.draft textarea:focus{background:var(--ontint)df5}
.dmg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.dmg .r{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:13px}
.dmg .r:last-child{border-bottom:0}
.dmg .r b{font-family:var(--f-disp);font-size:16px}
.dmg .r .dead{color:var(--live);font-weight:700}.dmg .r .ok{color:var(--green);font-weight:700}
.tbtn.dark{background:var(--btn);border-color:var(--btn);color:var(--btnfg)}
.uctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.uctl .grp{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.uctl .grp button{background:none;border:0;border-radius:4px;padding:5px 10px;font-weight:600;color:var(--ink2)}
.uctl .grp button.on{background:var(--btn);color:var(--btnfg)}
.uctl input[type=text],.uctl select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.us{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:12.5px}
.us th{font-weight:600;color:var(--mute);text-align:right;padding:8px 7px;border-bottom:1px solid var(--line);font-size:11px;white-space:nowrap;cursor:pointer;user-select:none;line-height:1.2}
.us th.on{color:var(--ink)}
.us td{padding:5px 7px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
.us th:nth-child(-n+2),.us td:nth-child(-n+2){text-align:left}
.us tr{cursor:pointer}.us tr:hover td{background:var(--surf2)}
.us td.sc{font-family:var(--f-disp);font-size:16px;font-weight:800}
.us .bar{display:inline-block;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:5px;opacity:.75}
.fa{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--chipbg);color:var(--chipfg);margin-left:2px}
.ro{font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;background:var(--surf2);color:var(--mute);margin-left:2px}
.own{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--btn);color:var(--btnfg);margin-left:2px}
.us svg.spk{vertical-align:middle}
.mv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:var(--r);padding:10px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:12px;cursor:pointer}
.mv.down{border-left-color:var(--live)}.mv.buy{border-left-color:var(--accent)}.mv.spike{border-left-color:var(--purple)}
.mv b.t{font-family:var(--f-disp);font-size:17px;font-weight:700;display:block}
.mv .why{color:var(--ink2);margin-top:2px;line-height:1.4}
.mv .mag{font-family:var(--f-disp);font-size:26px;font-weight:800;text-align:right;line-height:1}
.mv .mag small{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:500;color:var(--mute)}
.mv .tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.pdet .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.pdet .kpi div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.pdet .kpi b{font-family:var(--f-disp);font-size:22px;font-weight:800;display:block;line-height:1}
.pdet .kpi small{color:var(--mute);font-size:11px}
.wk{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center;font-size:12.5px;padding:16px 0 14px}

<script src="nflverse_2026.js" onerror="window.NFLVERSE=null"></script>
<script>
/* =====================================================================
   NFL Sunday Desk — single-file live dashboard
   Data: ESPN public scoreboard/summary JSON + Sleeper public API.
   ===================================================================== */
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const SLP  = 'https://api.sleeper.app/v1';
const SLPX = 'https://api.sleeper.com';
const GAMES_MS = 6000;    // scoreboard + changed games
const SLEEPER_MS = 30000; // fantasy + usage + top scorers
const SCORING = {pass_yd:.04,pass_td:4,pass_int:-1,rush_yd:.1,rush_td:6,rec:1,rec_yd:.1,rec_td:6,fum_lost:-2,ret_td:6,fg:3,xp:1};
const TEAMMAP = {WAS:'WSH'};           // Sleeper -> ESPN
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S = {
  view:'games', games:[], summaries:{}, plays:[], seen:new Set(), filters:new Set(['TD','FG','TO','BIG','INJ','RZ']),
  openGame:null, detailTab:'summary',
  sleeper:{user:null,username:localStorage.getItem('slp_user')||'brendanbhambri',leagues:[],league:null,data:{},stats:null,proj:null,players:{},week:null,season:null},
  lbPos:'ALL', lbSort:'pts_ppr', lbQ:'', showBench:false, timer:null, busy:false, err:null, lastOk:null
};

/* ---------------- UI state persistence ---------------- */
const UI_KEYS=['view','filters','lbPos','lbSort','showBench','detailTab','topPos','topKey','apGame','usage'];
function saveUI(){ try{ localStorage.setItem('ui',JSON.stringify({view:S.view,filters:[...S.filters],lbPos:S.lbPos,lbSort:S.lbSort,showBench:S.showBench,detailTab:S.detailTab,topPos:S.topPos,topKey:S.topKey,apGame:S.ap?.game,usage:{pos:S.usage?.pos,view:S.usage?.view,sort:S.usage?.sort,faOnly:S.usage?.faOnly,week:S.usage?.week},seen:[...S.seen].slice(-2000)})); }catch(e){} }
function restoreUI(){ let u=null; try{ u=JSON.parse(localStorage.getItem('ui')||'null'); }catch(e){} if(!u) return;
  if(u.view) S.view=u.view; if(Array.isArray(u.filters)) S.filters=new Set(u.filters); if(u.lbPos) S.lbPos=u.lbPos; if(u.lbSort) S.lbSort=u.lbSort; if(u.showBench!=null) S.showBench=u.showBench; if(u.detailTab) S.detailTab=u.detailTab;
  if(u.topPos) S.topPos=u.topPos; if(u.topKey) S.topKey=u.topKey; if(u.apGame&&S.ap) S.ap.game=u.apGame; if(u.usage&&S.usage){ Object.assign(S.usage,{pos:u.usage.pos||S.usage.pos,view:u.usage.view||S.usage.view,sort:u.usage.sort||S.usage.sort,faOnly:!!u.usage.faOnly,week:u.usage.week||null}); }
  if(Array.isArray(u.seen)) S.seen=new Set(u.seen);
}
// save whenever anything renders or the page is left
window.addEventListener('beforeunload',saveUI); document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveUI(); });

/* ---------------- fetching ---------------- */
async function getJSON(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(r.status+' '+url); return r.json(); }

async function loadGames(){
  const sb = await getJSON(`${ESPN}/scoreboard`);
  S.games = sb.events.map(normGame);
  S.weekLabel = `Week ${sb.week?.number??''} · ${sb.season?.year??''}`;
  const now=Date.now();
  // fast path: the scoreboard already carries the newest play — show it now, let the summary catch up
  for(const g of S.games){ const sm=S.summaries[g.id], lp=g.sit.lastPlay; if(!sm||!lp||g.state!=='in') continue;
    if(sm.lastId!==g.sit.lastId && !sm.plays.some(p=>p.id===lp.id)){
      const possTeam=g.sit.possId===g.home.id?g.home:g.sit.possId===g.away.id?g.away:null;
      sm.plays.push({id:lp.id,type:{text:lp.type?.text||''},text:lp.text||'',scoringPlay:!!lp.scoreValue,statYardage:lp.statYardage||0,period:{number:g.period},clock:{displayValue:g.clock},wallclock:new Date().toISOString(),modified:new Date().toISOString(),sequenceNumber:String(1e9+sm.plays.length),driveTeam:possTeam?.abbr||lp.team?.abbreviation||'',awayScore:g.away.score,homeScore:g.home.score,start:lp.start||null,provisional:true});
    } }
  const need = S.games.filter(g=>{
    const cur=S.summaries[g.id];
    if(g.state==='in') return !cur || cur.lastId!==g.sit.lastId || now-cur.at>90000;  // only when a new play posted (or 90s fallback)
    if(g.state==='post') return !cur || !cur.final;        // fetch finals once
    return false;
  });
  await Promise.all(need.map(async g=>{
    try{ const s=await getJSON(`${ESPN}/summary?event=${g.id}`); S.summaries[g.id]=normSummary(g,s); S.summaries[g.id].lastId=g.sit.lastId; S.summaries[g.id].at=Date.now(); }
    catch(e){ console.warn('summary failed',g.id,e); }
  }));
  buildPlays();
}
function normGame(ev){
  const c=ev.competitions[0], st=ev.status||c.status;
  const t=c.competitors.map(x=>({id:x.team.id,abbr:x.team.abbreviation,name:x.team.shortDisplayName,full:x.team.displayName,logo:x.team.logo,color:'#'+(x.team.color||'333'),home:x.homeAway==='home',score:+x.score||0,rec:(x.records||[]).find(r=>r.type==='total')?.summary||'',ls:(x.linescores||[]).map(l=>l.displayValue)}));
  const home=t.find(x=>x.home), away=t.find(x=>!x.home);
  const sit=c.situation||{};
  return {id:ev.id,date:ev.date,short:ev.shortName,state:st.type.state,detail:st.type.shortDetail,completed:st.type.completed,period:st.period,clock:st.displayClock,clockSec:+st.clock||0,
    home,away,tv:(c.broadcasts||[]).flatMap(b=>b.names).join('/'),
    sit:{lastId:sit.lastPlay?.id||'',lastPlay:sit.lastPlay||null,down:sit.shortDownDistanceText||sit.downDistanceText||'',pos:sit.possessionText||'',possId:sit.possession,rz:!!sit.isRedZone,last:sit.lastPlay?.text||'',homeWP:sit.lastPlay?.probability?.homeWinPercentage},
    leaders:(c.leaders||[]).map(l=>({k:l.shortDisplayName,v:l.leaders?.[0]?.displayValue,who:l.leaders?.[0]?.athlete?.shortName,head:l.leaders?.[0]?.athlete?.headshot,team:l.leaders?.[0]?.team?.id})),
    odds:c.odds?.[0]?.details};
}
function normSummary(g,s){
  const seenD=new Set(); const drives=[...(s.drives?.previous||[]),...(s.drives?.current?[s.drives.current]:[])].filter(d=>{ if(seenD.has(d.id)) return false; seenD.add(d.id); return true; });
  const plays=[]; drives.forEach((d,di)=>{(d.plays||[]).forEach(p=>plays.push({...p,driveIdx:di,driveTeam:d.team?.abbreviation}))});
  return {final:g.state==='post',scoring:s.scoringPlays||[],drives,current:s.drives?.current||null,plays,
    box:(s.boxscore?.players||[]).map(t=>({team:t.team,stats:t.statistics})),
    injuries:(s.injuries||[]).map(t=>({team:t.team?.abbreviation,list:(t.injuries||[]).map(i=>({status:i.status,name:i.athlete?.displayName,pos:i.athlete?.position?.abbreviation}))})),
    wp:s.winprobability?.at(-1)?.homeWinPercentage, odds:s.pickcenter?.[0]?{details:s.pickcenter[0].details,spread:s.pickcenter[0].spread,ou:s.pickcenter[0].overUnder,homeFav:!!s.pickcenter[0].homeTeamOdds?.favorite}:null};
}

/* ---------------- big plays ---------------- */
const BIGRE={inj:/injur/i, downs:/turnover on downs|on downs/i};
function classifyPlay(p){
  const tags=[]; const ty=(p.type?.text||'');
  if(p.scoringPlay){ if(/touchdown/i.test(ty)||/touchdown/i.test(p.text)) tags.push('TD'); else if(/field goal/i.test(ty)) tags.push('FG'); else if(/safety/i.test(ty)) tags.push('SAFETY'); else tags.push('TD'); }
  if((p.isTurnover||/interception|opponent|turnover on downs/i.test(ty)||BIGRE.downs.test(ty))&&!/\(own\)/i.test(ty)&&!/no play/i.test(p.text)) tags.push('TO');
  if(!p.scoringPlay && (p.statYardage||0)>=20 && /rush|reception|pass/i.test(ty) && !/no play/i.test(p.text)) tags.push('BIG');
  if(BIGRE.inj.test(p.text)) tags.push('INJ');
  return tags;
}
function buildPlays(){
  const out=[];
  for(const g of S.games){
    const sm=S.summaries[g.id]; if(!sm) continue;
    for(const p of sm.plays){
      const tags=classifyPlay(p); if(!tags.length) continue;
      out.push({id:p.id,gid:g.id,g,tags,text:shortPlay(p.text,tags),full:p.text,period:p.period?.number,clock:p.clock?.displayValue,wall:p.wallclock||p.modified||'',yd:p.statYardage,score:`${g.away.abbr} ${p.awayScore}–${p.homeScore} ${g.home.abbr}`,team:p.driveTeam,seq:+p.sequenceNumber||0});
    }
  }
  out.sort((a,b)=> (b.wall||'').localeCompare(a.wall||'') || b.seq-a.seq);
  S.plays=out;
}

/* ---------------- Sleeper ---------------- */
async function loadSleeper(full){
  const sl=S.sleeper;
  if(full||!sl.user){
    const st=await getJSON(`${SLP}/state/nfl`); sl.week=st.week; sl.season=st.season;
    sl.user=await getJSON(`${SLP}/user/${encodeURIComponent(sl.username)}`);
    sl.leagues=await getJSON(`${SLP}/user/${sl.user.user_id}/leagues/nfl/${sl.season}`);
    if(!sl.league && sl.leagues.length) sl.league=localStorage.getItem('slp_league')||sl.leagues[0].league_id;
    if(!sl.leagues.find(l=>l.league_id===sl.league)) sl.league=sl.leagues[0]?.league_id;
  }
  const pos='&position[]=QB&position[]=RB&position[]=WR&position[]=TE&position[]=K&position[]=DEF';
  const [stats,proj]=await Promise.all([
    getJSON(`${SLPX}/stats/nfl/${sl.season}/${sl.week}?season_type=regular${pos}&order_by=pts_ppr`),
    sl.proj||getJSON(`${SLPX}/projections/nfl/${sl.season}/${sl.week}?season_type=regular${pos}&order_by=pts_ppr`)
  ]);
  sl.stats=stats; sl.proj=proj;
  const learn=r=>{ if(r.player&&!sl.players[r.player_id]) sl.players[r.player_id]={name:r.player.position==='DEF'?`${r.player.first_name} ${r.player.last_name}`:`${r.player.first_name} ${r.player.last_name}`,pos:r.player.position,team:r.team||r.player.team,inj:r.player.injury_status}; };
  proj.forEach(learn); stats.forEach(learn);
  sl.statsById={}; stats.forEach(r=>sl.statsById[r.player_id]=r);
  sl.projById={}; proj.forEach(r=>sl.projById[r.player_id]=r);
  // league data (all leagues, so game cards can flag my players everywhere)
  await Promise.all(sl.leagues.map(async l=>{
    const d=sl.data[l.league_id]||{};
    if(!d.rosters){ [d.rosters,d.users]=await Promise.all([getJSON(`${SLP}/league/${l.league_id}/rosters`),getJSON(`${SLP}/league/${l.league_id}/users`)]); }
    d.matchups=await getJSON(`${SLP}/league/${l.league_id}/matchups/${sl.week}`);
    d.league=l; sl.data[l.league_id]=d;
  }));
  // any roster player we still can't name? pull the big player list once (cached)
  const unknown=new Set();
  Object.values(sl.data).forEach(d=>d.rosters.forEach(r=>(r.players||[]).forEach(p=>{ if(!sl.players[p]) unknown.add(p); })));
  if(unknown.size){
    let cache=null; try{ cache=JSON.parse(localStorage.getItem('slp_players')||'null'); }catch(e){}
    if(!cache||Date.now()-cache.t>7*864e5){
      try{ const all=await getJSON(`${SLP}/players/nfl`); const m={}; for(const [id,p] of Object.entries(all)){ if(p.position&&['QB','RB','WR','TE','K','DEF'].includes(p.position)) m[id]={name:p.position==='DEF'?`${p.first_name} ${p.last_name}`:`${p.first_name} ${p.last_name}`,pos:p.position,team:p.team,inj:p.injury_status}; } cache={t:Date.now(),m}; try{localStorage.setItem('slp_players',JSON.stringify(cache));}catch(e){} }catch(e){ console.warn('players list failed',e); }
    }
    if(cache) unknown.forEach(id=>{ if(cache.m[id]) sl.players[id]=cache.m[id]; });
  }
  S.sleeper.posIdx=null; buildMine();
}
function pname(id){ const p=S.sleeper.players[id]; return p?p.name:(id.length<4?id+' D/ST':'Player '+id); }
function buildMine(){ // playerId -> {leagues:[name], pts}
  const sl=S.sleeper, mine={}, opp={};
  for(const d of Object.values(sl.data)){
    const my=d.rosters.find(r=>r.owner_id===sl.user.user_id||(r.co_owners||[]).includes(sl.user.user_id)); if(!my) continue;
    const mm=d.matchups.find(m=>m.roster_id===my.roster_id);
    const om=mm&&d.matchups.find(m=>m.matchup_id===mm.matchup_id&&m.roster_id!==my.roster_id);
    (mm?.starters||my.starters||[]).forEach(p=>{ (mine[p]=mine[p]||[]).push(d.league.name); });
    (om?.starters||[]).forEach(p=>{ (opp[p]=opp[p]||[]).push(d.league.name); });
  }
  sl.mine=mine; sl.opp=opp;
  // by ESPN team -> list of my starters, for game cards
  sl.byTeam={};
  const add=(map,id,kind)=>{ const p=sl.players[id]; if(!p||!p.team) return; const t=TEAMMAP[p.team]||p.team; (sl.byTeam[t]=sl.byTeam[t]||[]).push({id,kind,name:p.name,pos:p.pos,pts:sl.statsById?.[id]?.stats?.pts_ppr}); };
  Object.keys(mine).forEach(id=>add(mine,id,'me')); Object.keys(opp).forEach(id=>{ if(!mine[id]) add(opp,id,'opp'); });
}

/* ---------------- refresh loop ---------------- */
S.errs={};
async function refreshGames(){
  if(S.busyG||document.hidden) return; S.busyG=true; setStatus('busy');
  try{ await loadGames(); delete S.errs.espn; S.lastOk=new Date(); }catch(e){ S.errs.espn='ESPN: '+e.message; console.error(e); }
  S.busyG=false; finishStatus(); render();
}
async function refreshSleeper(){
  if(S.busyS||document.hidden) return; S.busyS=true; setStatus('busy');
  try{ await loadSleeper(false); delete S.errs.slp; }catch(e){ S.errs.slp='Sleeper: '+e.message; console.error(e); }
  try{ if(S.sleeper.week) await loadUsage(); delete S.errs.use; }catch(e){ S.errs.use='Usage: '+e.message; console.error(e); }
  S.busyS=false; finishStatus(); render();
}
function finishStatus(){ S.err=Object.values(S.errs).join(' · ')||null; if(!S.busyG&&!S.busyS) setStatus(S.err?'err':'ok'); }
async function refresh(){ await Promise.all([refreshGames(),refreshSleeper()]); }
function setStatus(k){
  $('#dot').className='dot '+(k==='ok'?'':k);
  $('#upd').textContent = k==='busy'?'Updating…':(S.err?S.err:(S.lastOk?'Updated '+S.lastOk.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'}):''));
  $('#upd').title=S.err||'';
}
function schedule(){ clearInterval(S.timer); clearInterval(S.timer2); if($('#auto').checked){ S.timer=setInterval(refreshGames,GAMES_MS); S.timer2=setInterval(refreshSleeper,SLEEPER_MS); } }

/* ---------------- helpers ---------------- */
const teamLogo=a=>`https://a.espncdn.com/i/teamlogos/nfl/500/${String(TEAMMAP[a]||a||'').toLowerCase()}.png`;
const thumb=(id,pos)=>pos==='DEF'?`https://sleepercdn.com/images/team_logos/nfl/${String(id).toLowerCase()}.png`:`https://sleepercdn.com/content/nfl/players/thumb/${id}.jpg`;
const espnHead=id=>`https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`;
const IMGERR=`onerror="this.style.visibility='hidden'"`;
function teamOf(abbr){ for(const g of S.games){ if(g.home.abbr===abbr) return {g,t:g.home,opp:g.away}; if(g.away.abbr===abbr) return {g,t:g.away,opp:g.home}; } return null; }
function posMatch(sel,pos){ return sel==='ALL'||(sel==='FLEX'?['RB','WR','TE'].includes(pos):pos===sel); }
function scoreKey(league){ const r=+(league?.scoring_settings?.rec??1); return r>=1?'pts_ppr':r>0?'pts_half_ppr':'pts_std'; }
function fracLeft(team){ // share of the game still to be played for a team, 0..1
  const x=teamOf(TEAMMAP[team]||team); if(!x) return 1; const g=x.g;
  if(g.state==='post') return 0; if(g.state==='pre') return 1;
  const per=Math.min(g.period,4), played=(per-1)*900+(900-(g.clockSec||0)); return Math.max(0,Math.min(1,1-played/3600));
}
function liveProj(id,actual,key){ // actual so far + remaining share of projection
  const p=S.sleeper.players[id], pr=S.sleeper.projById?.[id]?.stats?.[key]; if(pr==null) return actual;
  const left=p?.team?fracLeft(p.team):0; return actual+pr*left;
}
function matchupProj(m,key){ return (m.starters||[]).reduce((t,id,i)=>t+liveProj(id,m.players_points?.[id]??m.starters_points?.[i]??0,key),0); }
function myMatchups(){ // [{league,my,mm,or,om,myName,opName,myProj,opProj}]
  const sl=S.sleeper, out=[]; if(!sl.user) return out;
  for(const d of Object.values(sl.data)){
    const my=d.rosters.find(r=>r.owner_id===sl.user.user_id||(r.co_owners||[]).includes(sl.user.user_id)); if(!my) continue;
    const mm=d.matchups.find(m=>m.roster_id===my.roster_id); if(!mm) continue;
    const om=d.matchups.find(m=>m.matchup_id===mm.matchup_id&&m.roster_id!==my.roster_id);
    const or=om&&d.rosters.find(r=>r.roster_id===om.roster_id); const key=scoreKey(d.league);
    out.push({d,league:d.league,my,mm,or,om,key,myName:teamName(d,my),opName:or?teamName(d,or):'Bye',myProj:matchupProj(mm,key),opProj:om?matchupProj(om,key):0});
  }
  return out;
}
function gameStatusFor(team){ const x=teamOf(TEAMMAP[team]||team); if(!x) return {txt:'—',live:false,done:false}; const g=x.g; if(g.state==='in') return {txt:g.detail,live:true,done:false}; if(g.state==='post') return {txt:'Final',live:false,done:true}; return {txt:new Date(g.date).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),live:false,done:false}; }
function fpts(cat,st){ // ESPN box score row -> PPR points
  const n=i=>parseFloat(st[i])||0, frac=i=>String(st[i]||'0/0').split('/').map(Number);
  switch(cat){
    case 'passing': return n(1)*SCORING.pass_yd+n(3)*SCORING.pass_td+n(4)*SCORING.pass_int;
    case 'rushing': return n(1)*SCORING.rush_yd+n(3)*SCORING.rush_td;
    case 'receiving': return n(0)*SCORING.rec+n(1)*SCORING.rec_yd+n(3)*SCORING.rec_td;
    case 'kicking': { const [fm]=frac(0), [xm]=frac(3); return fm*SCORING.fg+xm*SCORING.xp; }
    case 'kickReturns': case 'puntReturns': return n(4)*SCORING.ret_td;
    case 'fumbles': return n(1)*SCORING.fum_lost;
    default: return 0;
  }
}
function boxPlayers(sm){ // merge across categories -> per player fantasy line
  const m={};
  for(const t of sm.box){ for(const cat of t.stats){ for(const a of cat.athletes){ const id=a.athlete.id; const r=m[id]=m[id]||{id,name:a.athlete.displayName,head:a.athlete.headshot?.href||espnHead(id),team:t.team.abbreviation,pos:a.athlete.position?.abbreviation||posByName(a.athlete.displayName),pts:0,line:[]}; const p=fpts(cat.name,a.stats); r.pts+=p; const L=cat.labels;
    if(cat.name==='passing') r.line.push(`${a.stats[0]}, ${a.stats[1]} yds, ${a.stats[3]} TD${+a.stats[4]?`, ${a.stats[4]} INT`:''}`);
    else if(cat.name==='rushing') r.line.push(`${a.stats[0]} car ${a.stats[1]} yds${+a.stats[3]?` ${a.stats[3]} TD`:''}`);
    else if(cat.name==='receiving') r.line.push(`${a.stats[0]}/${a.stats[5]} rec ${a.stats[1]} yds${+a.stats[3]?` ${a.stats[3]} TD`:''}`);
    else if(cat.name==='kicking') r.line.push(`FG ${a.stats[0]}, XP ${a.stats[3]}`);
    else if(cat.name==='fumbles'&&+a.stats[1]) r.line.push(`${a.stats[1]} fum lost`);
    else if(/Returns/.test(cat.name)&&+a.stats[4]) r.line.push(`${a.stats[4]} ret TD`);
  } } }
  return Object.values(m).filter(r=>r.line.length).sort((a,b)=>b.pts-a.pts);
}
function normName(n){ return String(n||'').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\.?$/,'').replace(/[.'’\-]/g,'').replace(/\s+/g,' ').trim(); }

function recap(g,sm){
  const lead=g.home.score===g.away.score?null:(g.home.score>g.away.score?g.home:g.away), trail=lead===g.home?g.away:g.home;
  let s='';
  if(g.state==='pre') s=`Kicks off at ${new Date(g.date).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${g.tv?' on '+g.tv:''}.${g.odds?' Line: '+g.odds+'.':''}`;
  else if(!lead) s=`Tied ${g.home.score}–${g.away.score}${g.state==='post'?' (final)':' in the '+ord(g.period)}.`;
  else s=`${lead.name} ${g.state==='post'?'beat':'lead'} ${trail.name} ${lead.score}–${trail.score}${g.state==='in'?`, ${g.clock} left in the ${ord(g.period)}`:''}.`;
  if(sm){
    const tds=sm.scoring.filter(p=>p.scoringType?.abbreviation==='TD'||/touchdown/i.test(p.type?.text));
    const tos=sm.plays.filter(p=>classifyPlay(p).includes('TO'));
    const big=sm.plays.filter(p=>classifyPlay(p).includes('BIG'));
    const parts=[]; if(tds.length) parts.push(`${tds.length} TD${tds.length>1?'s':''} (${tds.map(p=>p.team?.abbreviation+': '+shortScorer(p.text)).join('; ')})`);
    if(tos.length) parts.push(`${tos.length} turnover${tos.length>1?'s':''}`); if(big.length) parts.push(`${big.length} play${big.length>1?'s':''} of 20+ yds`);
    if(parts.length) s+=' '+parts.join(', ')+'.';
    if(sm.current&&g.state==='in') s+=` ${sm.current.team?.abbreviation||''} currently driving: ${sm.current.description}.`;
    const bp=boxPlayers(sm)[0]; if(bp) s+=` Top fantasy line: ${bp.name} ${bp.pts.toFixed(1)} PPR (${bp.line.join(', ')}).`;
  }
  return s;
}

function shortPlay(text,tags){
  let t=String(text||'').trim();
  t=t.replace(/^\s*\((?:[^()]*)\)\s*/,'');                       // formation prefix: (Shotgun), (No Huddle, Shotgun)
  let sents=t.split(/(?<=[.!?])\s+(?=[A-Z(])/);                 // sentences
  const pre=/reported in as eligible|reported as eligible|direct snap|^\(.*\)\.?$/i;
  const core=sents.filter(x=>!pre.test(x)); if(core.length) sents=core;
  let out=sents[0]||t;
  const pick=re=>{ const i=sents.findIndex(x=>re.test(x)); if(i>=0){ out=sents[i]; if(/^FUMBLES/i.test(out)&&i>0) out=sents[i-1]+' '+out; } };
  if(tags){ if(tags.includes('TD')) pick(/TOUCHDOWN/i); else if(tags.includes('FG')) pick(/field goal/i); else if(tags.includes('SAFETY')) pick(/SAFETY/i); else if(tags.includes('TO')) pick(/INTERCEPT|FUMBLE|on downs/i); }
  if(tags&&tags.includes('INJ')){ const inj=sents.find(x=>/injur/i.test(x)); if(inj&&inj!==out) out+=' '+inj; }
  if(/FUMBLES/i.test(out)){ const rec=sents.find(x=>/RECOVERED|recovers/i.test(x)); if(rec&&!out.includes(rec)) out+=' '+rec.replace(/\s*\([^)]*\)/g,''); }
  out=out.replace(/\s*\[[^\]]*\]/g,'')                            // [pressure by]
         .replace(/\s*\([^()]*\)/g,'')                              // (tacklers), (formation)
         .replace(/,?\s*Center-[A-Z]\.[\w'-]+(,\s*Holder-[A-Z]\.[\w'-]+)?/g,'')     // FG snap/hold
         .replace(/\s*PENALTY.*$/,'')
         .replace(/\s+/g,' ').replace(/\s+([.,])/g,'$1').trim();
  if(!/[.!?]$/.test(out)) out+='.';
  return out;
}

function recapModel(){

  const rows=(sl.stats||[]).filter(r=>r.player&&['QB','RB','WR','TE'].includes(r.player.position)&&done(r));
  rows.sort((a,b)=>(b.stats?.pts_ppr||0)-(a.stats?.pts_ppr||0));
  rows.slice(0,3).forEach((r,i)=>{ const p=r.stats.pts_ppr, line=statLine(r.player.position,r.stats); st.push({logo:teamLogo(r.team),k:'star',w:800-i*30,t:`${pname(r.player_id)} goes off: ${p.toFixed(1)} PPR`,d:`${r.player.position}, ${r.team} vs ${r.opponent}: ${line}.`,j:pick(JOKES.star,S.jokeSeed+i)({n:pname(r.player_id),p:p.toFixed(1),line})}); });
  const busts=rows.filter(r=>(sl.projById?.[r.player_id]?.stats?.pts_ppr||0)>=14&&(r.stats.pts_ppr||0)<5).sort((a,b)=>(sl.projById[b.player_id].stats.pts_ppr-b.stats.pts_ppr)-(sl.projById[a.player_id].stats.pts_ppr-a.stats.pts_ppr)).slice(0,3);
  busts.forEach((r,i)=>{ const pr=sl.projById[r.player_id].stats.pts_ppr; st.push({logo:teamLogo(r.team),k:'bust',w:420-i*10,t:`${pname(r.player_id)} no-shows: ${(r.stats.pts_ppr||0).toFixed(1)} pts`,d:`Projected ${pr.toFixed(1)}. ${statLine(r.player.position,r.stats)||'No stats.'}`,j:pick(JOKES.bust,S.jokeSeed+i+3)({n:pname(r.player_id),p:(r.stats.pts_ppr||0).toFixed(1),pr:pr.toFixed(1)})}); });
  st.sort((a,b)=>b.w-a.w);
  dmg.sort((a,b)=>(a.favWon-b.favWon)||(b.pts-a.pts));
  return {st,dmg,finals,pending:S.games.filter(g=>g.state!=='post')};
}
function slackDraft(m){
  const wk=S.weekLabel||''; const L=[];
  L.push(`*Survivor ${wk.replace(' ·',' —')} recap* 🏈`); L.push('');
  L.push('*Survivor stats*'); L.push('[[ entries alive / eliminated this week / most-picked team — paste your numbers here ]]'); L.push('');
  const dead=m.dmg.filter(d=>!d.favWon);
  if(dead.length){ L.push('*Favorites that fell (a.k.a. the graveyard)*'); dead.forEach(d=>L.push(`• ${d.fav} (-${d.pts}) lost to ${d.dog} ${d.g.away.abbr} ${d.g.away.score}-${d.g.home.score} ${d.g.home.abbr}`)); L.push(''); }
  const safe=m.dmg.filter(d=>d.favWon&&d.pts>=6); if(safe.length){ L.push('*Chalk that held*'); L.push(safe.map(d=>`${d.fav} (-${d.pts})`).join(', ')+' all did what they were supposed to. Boring. Effective.'); L.push(''); }
  L.push('*Storylines*'); m.st.slice(0,8).forEach(s=>{ L.push(`• *${s.t}.* ${s.d} ${s.j}`); }); L.push('');
  if(m.pending.length){ L.push(`_Still to play: ${m.pending.map(g=>g.away.abbr+' @ '+g.home.abbr).join(', ')} — recap updates once they're final._`); L.push(''); }
  L.push('Picks for next week are due before Thursday kickoff. Choose wisely, or at least choose differently than last week.');
  return L.join('\n');
}
function renderRecap(){
  const m=recapModel(); const n=m.finals.length;
  let h=`<div class="sect">Week in review <span>${n} of ${S.games.length} games final${m.pending.length?' · '+m.pending.length+' still to play':''}</span></div>`;
  if(!n){ $('#v-recap').innerHTML=h+'<div class="empty">Storylines appear as games go final. Check back after the early window.</div>'; return; }
  h+=`<div class="rc"><div class="col">`;
  h+=`<div class="dmg"><b style="font-family:var(--f-disp);font-size:17px">Survivor damage report</b><small style="color:var(--mute);display:block;margin-bottom:6px">Every favorite this week, by closing spread. Red = a favorite that lost.</small>${m.dmg.map(d=>`<div class="r"><img src="${teamLogo(d.favAbbr)}" alt="" ${IMGERR}><span><b>${esc(d.fav)}</b> <span style="color:var(--mute)">-${d.pts} vs ${esc(d.dog)}</span></span><span class="num">${d.g.away.abbr} ${d.g.away.score}–${d.g.home.score} ${d.g.home.abbr}</span><span class="${d.favWon?'ok':'dead'}">${d.tie?'Tie':d.favWon?'Survived':'Eliminated'}</span></div>`).join('')||'<div class="note">No spreads available for finished games.</div>'}</div>`;
  h+=m.st.map(s=>`<div class="story ${s.k}"><b class="t">${s.logo?`<img src="${s.logo}" alt="" ${IMGERR}>`:''}${esc(s.t)}</b>${esc(s.d)}<div class="jk">${esc(s.j)}</div></div>`).join('');
  h+=`</div><div class="col"><div class="draft"><div class="dhd"><b>Slack draft</b><button class="tbtn dark" id="cp">Copy for Slack</button><button class="tbtn" style="background:var(--card);color:var(--ink);border-color:var(--line)" id="rr">Reroll jokes</button><button class="tbtn" style="background:var(--card);color:var(--ink);border-color:var(--line)" id="rg">Regenerate</button></div><textarea id="draft">${esc(S.draftText||slackDraft(m))}</textarea></div><div class="note">Edit freely — your edits stay until you hit Regenerate. The [[ ]] block is where your survivor numbers go. Uses Slack formatting (*bold*, _italic_, • bullets).</div></div></div>`;
  $('#v-recap').innerHTML=h;
  $('#draft').oninput=e=>{ S.draftText=e.target.value; };
  $('#cp').onclick=async()=>{ const t=$('#draft').value; try{ await navigator.clipboard.writeText(t); $('#cp').textContent='Copied'; }catch(e){ $('#draft').select(); document.execCommand('copy'); $('#cp').textContent='Copied'; } setTimeout(()=>$('#cp').textContent='Copy for Slack',1500); };
  $('#rr').onclick=()=>{ S.jokeSeed=(S.jokeSeed+1)%97; localStorage.setItem('jokeSeed',S.jokeSeed); S.draftText=null; renderRecap(); };
  $('#rg').onclick=()=>{ S.draftText=null; renderRecap(); };
}

/* ---------------- head-to-head matchup ---------------- */
function headshot(id,pos){ return pos==='DEF'?`https://sleepercdn.com/images/team_logos/nfl/${String(id).toLowerCase()}.png`:`https://sleepercdn.com/content/nfl/players/thumb/${id}.jpg`; }
function h2h(d,my,mm,or,om,opts={}){ const isMine=opts.mine!==false, showBench=opts.bench??S.showBench;
  const sl=S.sleeper, key=scoreKey(d.league), slots=d.league.roster_positions.filter(x=>!['BN','IR','TAXI'].includes(x));
  const T=(r,m)=>{ const u=d.users.find(u=>u.user_id===r.owner_id); return {name:teamName(d,r),user:u?.display_name||'',av:u?.avatar?`https://sleepercdn.com/avatars/thumbs/${u.avatar}`:'',rec:`${r.settings?.wins??0}-${r.settings?.losses??0}`,pts:m.points||0,proj:matchupProj(m,key),left:m.starters.filter(p=>{const pl=sl.players[p];return pl&&pl.team&&!gameStatusFor(pl.team).done;}).length,m,r}; };
  const A=T(my,mm), B=T(or,om);
  const wp=1/(1+Math.exp(-(A.proj-B.proj)/11));
  const cell=(id,pts,right)=>{ const p=sl.players[id]||{}, st=sl.statsById?.[id]?.stats||{}, pr=sl.projById?.[id]?.stats?.[key], gs=p.team?gameStatusFor(p.team):{txt:'—'}, lp=liveProj(id,+pts,key), line=statLine(p.pos,st);
    return `<div class="hp ${right?'r':''} ${gs.done?'done':gs.live?'live':''}" data-prof="${id}"><img src="${headshot(id,p.pos)}" alt="" onerror="this.style.visibility='hidden'"><div class="hn"><b>${esc(pname(id))}${p.inj?` <em>${esc(p.inj)}</em>`:''}</b><small>${p.pos||''} · ${p.team||'FA'} · <span class="${gs.live?'lv':''}">${esc(gs.txt)}</span></small>${line?`<small class="ln">${esc(line)}</small>`:''}</div><div class="hs num"><b>${(+pts).toFixed(1)}</b><small>${pr==null?'':gs.done?'proj '+pr.toFixed(1):'→ '+lp.toFixed(1)}</small></div></div>`; };
  const rows=slots.map((slot,i)=>{ const a=A.m.starters[i], b=B.m.starters[i]; const ap=A.m.players_points?.[a]??A.m.starters_points?.[i]??0, bp=B.m.players_points?.[b]??B.m.starters_points?.[i]??0;
    return `<div class="hrow"><div class="${ap>bp?'win':''}">${a&&a!=='0'?cell(a,ap,false):'<div class="hp empty-slot">Empty</div>'}</div><div class="slot">${slot.replace('SUPER_FLEX','SF').replace('REC_FLEX','RF')}</div><div class="${bp>ap?'win':''}">${b&&b!=='0'?cell(b,bp,true):'<div class="hp r empty-slot">Empty</div>'}</div></div>`; }).join('');
  const bench=(t,right)=>(t.m.players||[]).filter(p=>!t.m.starters.includes(p)).map(p=>cell(p,t.m.players_points?.[p]??0,right)).join('');
  return `<div class="h2h">
    <div class="hhd">
      <div class="ht ${isMine?'me':''}"><img src="${A.av}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(A.name)}</b><small>${esc(A.user)} · ${A.rec} · ${A.left} left</small></div><div class="big num">${A.pts.toFixed(1)}<small>proj ${A.proj.toFixed(1)}</small></div></div>
      <div class="hv">vs</div>
      <div class="ht op"><div class="big num">${B.pts.toFixed(1)}<small>proj ${B.proj.toFixed(1)}</small></div><div><b>${esc(B.name)}</b><small>${esc(B.user)} · ${B.rec} · ${B.left} left</small></div><img src="${B.av}" alt="" onerror="this.style.visibility='hidden'"></div>
    </div>
    <div class="wpw" title="Win probability from live projections"><div class="wpl"><span><b>${Math.round(wp*100)}%</b> ${esc(A.name)}</span><span>${esc(B.name)} <b>${Math.round((1-wp)*100)}%</b></span></div><div class="wpb"><i style="width:${(wp*100).toFixed(1)}%"></i></div></div>
    ${rows}
    ${opts.noToggle?'':`<button class="bench-tg" data-bench="1">${showBench?'Hide benches':'Show benches'}</button>`}
    ${showBench?`<div class="hb"><div class="hbh">Bench</div><div>${bench(A,false)}</div><div>${bench(B,true)}</div></div>`:''}
  </div>`;
}

/* ---------------- render: game detail drawer ---------------- */
function openGame(id){ S.openGame=id; S.detailTab=S.detailTab||'summary'; $('#ov').classList.add('on'); $('#dr').classList.add('on'); renderDetail(); }
function closeGame(){ S.openGame=null; $('#ov').classList.remove('on'); $('#dr').classList.remove('on'); }
function renderDetail(){
  const g=S.games.find(x=>x.id===S.openGame); if(!g) return closeGame();
  const sm=S.summaries[g.id];
  const tm=(t,away)=>`<div class="tm ${away?'away':''}"><img src="${t.logo}" alt=""><div><b>${t.name}</b><small>${t.rec}${g.state==='in'&&g.sit.possId===t.id?' · has ball':''}</small></div><span class="s num">${g.state==='pre'?'':t.score}</span></div>`;
  let h=`<div class="dh"><div class="row"><span style="color:var(--mute);font-size:12.5px">${esc(g.tv)}${g.odds?' · '+esc(g.odds):''}</span><button class="x" id="dx" aria-label="Close">×</button></div><div class="score">${tm(g.away,true)}<div class="mid"><b class="${g.state==='post'?'fin':''}">${g.state==='pre'?new Date(g.date).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):g.detail}</b>${g.state==='in'?`${esc(g.sit.down)}${g.sit.pos?' at '+esc(g.sit.pos):''}`:''}</div>${tm(g.home,false)}</div></div>
  <div class="subt">${[['summary','Summary'],['box','Box score & fantasy'],['plays','All plays'],['inj','Injuries']].map(([k,l])=>`<button data-t="${k}" class="${S.detailTab===k?'on':''}">${l}</button>`).join('')}</div><div class="dbody">`;
  if(!sm){ h+=`<div class="recap">${esc(recap(g))}</div>${g.state==='pre'?'<div class="empty">Box score and plays appear once the game starts.</div>':'<div class="empty">Loading game details…</div>'}`; }
  else if(S.detailTab==='summary'){
    h+=`<div class="recap">${esc(recap(g,sm))}</div>`;
    h+=`<div class="h">Scoring plays</div>`+(sm.scoring.length?sm.scoring.map(p=>{const k=p.scoringType?.abbreviation||'';return `<div class="sp"><img src="${p.team?.logo||''}" alt=""><span><span class="k ${k==='TD'?'td':''}">${k}</span><small>${p.clock?.displayValue||''} ${ord(p.period?.number)}</small></span><span>${esc(p.text)}</span><span class="sc num">${p.awayScore}–${p.homeScore}</span></div>`}).join(''):'<div class="note">No scores yet.</div>');
    h+=`<div class="h">Drives</div>`+[...sm.drives].reverse().map((d,i)=>{const cur=sm.current&&d.id===sm.current.id&&g.state==='in';const res=(d.shortDisplayResult||d.displayResult||'').toUpperCase();return `<div class="dv"><img src="${d.team?.logos?.[0]?.href||''}" alt=""><span><b>${d.team?.abbreviation||''}</b> ${esc(d.description||'')}<br><small>Started ${esc(d.start?.text||'')} · ${d.start?.clock?.displayValue||''} ${ord(d.start?.period?.number)}</small></span><span class="res ${cur?'cur':res.replace(/[^A-Z]/g,'')}">${cur?'Driving':esc(d.displayResult||d.result||'')}</span></div>`}).join('');
  } else if(S.detailTab==='box'){
    const all=boxPlayers(sm);
    // add fantasy-relevant players who haven't recorded a stat yet (from Sleeper's projection list)
    const have=new Set(all.map(r=>normName(r.name)));
    for(const r of (S.sleeper.proj||[])){ const t=TEAMMAP[r.team]||r.team; if(t!==g.home.abbr&&t!==g.away.abbr) continue; const pos=r.player?.position; if(!['QB','RB','WR','TE','K'].includes(pos)) continue; const nm=pname(r.player_id); if(have.has(normName(nm))) continue; if((r.stats?.pts_ppr||0)<1) continue; have.add(normName(nm)); all.push({id:'s'+r.player_id,sid:r.player_id,name:nm,team:t,pos,pts:0,line:[],proj:r.stats.pts_ppr}); }
    for(const r of all){ if(r.proj==null){ const pid=idByName(r.name); r.proj=S.sleeper.projById?.[pid]?.stats?.pts_ppr; } }
    all.sort((a,b)=>b.pts-a.pts||(b.proj||0)-(a.proj||0));
    h+=`<div class="note">Fantasy points are standard PPR computed from ESPN's box score (4-pt pass TD, -1 INT, -2 fumble lost, 3 per FG, 1 per XP). Players without a stat yet are listed at 0.0 with their projection. ★ marks your Sleeper starters.</div>`;
    for(const t of [g.away,g.home]){ const rows=all.filter(r=>r.team===t.abbr); if(!rows.length) continue;
      h+=`<table class="bx"><caption>${t.full}</caption><thead><tr><th>Player</th><th style="text-align:left">Line</th><th>Proj</th><th>FPTS</th></tr></thead><tbody>${rows.map(r=>`<tr class="${isMineName(r.name)?'my':''}" data-prof="${r.sid||idByName(r.name)||''}"><td><span class="ph"><img src="${r.head||(r.sid?thumb(r.sid,r.pos):'')}" alt="" ${IMGERR}><span>${esc(r.name)} <span style="color:var(--mute);font-weight:400">${r.pos}</span></span></span></td><td style="text-align:left;white-space:normal;color:var(--ink2)">${r.line.length?esc(r.line.join(' · ')):'<span style="color:var(--mute)">no stats yet</span>'}</td><td class="num" style="color:var(--mute)">${r.proj!=null?r.proj.toFixed(1):'–'}</td><td class="fp num">${r.pts.toFixed(1)}</td></tr>`).join('')}</tbody></table>`; }
  } else if(S.detailTab==='plays'){
    const pl=[...sm.plays].reverse();
    h+=`<div class="note">Newest first. Highlighted rows are scores, turnovers, 20+ yard plays and injuries.</div>`+pl.map(p=>{const tags=classifyPlay(p);return `<div class="pl ${tags.length?'big':''} ${p.scoringPlay?'score':''}"><span class="when">${p.clock?.displayValue||''} ${ord(p.period?.number)}<br>${p.driveTeam||''}</span><span>${tags.map(t=>`<span class="tag ${t}">${TAGN[t]||t}</span>`).join('')}${esc(p.text)}</span></div>`}).join('');
  } else {
    h+=sm.injuries.map(t=>`<div class="h">${t.team}</div>`+(t.list.length?t.list.map(i=>`<div class="dv"><span><b>${esc(i.name)}</b> <small>${i.pos||''}</small></span><span class="res">${esc(i.status)}</span></div>`).join(''):'<div class="note">No listed injuries.</div>')).join('')||'<div class="note">No injury report available.</div>';
  }
  h+='</div>';
  const dr=$('#dr'); const scroll=dr.querySelector('.dbody')?.scrollTop||0; dr.innerHTML=h; dr.querySelector('.dbody').scrollTop=scroll;
  $('#dx').onclick=closeGame; dr.querySelectorAll('.subt button').forEach(b=>b.onclick=()=>{S.detailTab=b.dataset.t;renderDetail();});
}

/* ---------------- events ---------------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ S.view=b.dataset.v; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+S.view)); render(); });
document.addEventListener('click',e=>{ const pf=e.target.closest('[data-prof]'); if(pf&&pf.dataset.prof){ e.stopPropagation(); openProfile(pf.dataset.prof); return; }
  const f=e.target.closest('[data-f]'); if(f){ S.filters.has(f.dataset.f)?S.filters.delete(f.dataset.f):S.filters.add(f.dataset.f); renderPlays(); return; }
  const g=e.target.closest('[data-g]'); if(g) return openGame(g.dataset.g);
  const lg=e.target.closest('[data-lg]'); if(lg){ S.sleeper.league=lg.dataset.lg; localStorage.setItem('slp_league',lg.dataset.lg); document.querySelector('.tabs button[data-v=fantasy]').click(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeGame(); closeModal(); } if(e.key==='Enter'&&e.target.classList?.contains('g')) openGame(e.target.dataset.g); });
$('#ov').onclick=closeGame;
$('#refresh').onclick=refresh;

$('#auto').onchange=schedule;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });

restoreUI();
(function(){ const b=document.querySelector(`.tabs button[data-v=${S.view}]`)||document.querySelector('.tabs button[data-v=games]'); S.view=b.dataset.v; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+S.view)); })();
refresh(); schedule();
</script>
